[project]
name = "research-ocr"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
# The native doc_parser command exports DOCX alongside JSON and Markdown.
dependencies = ["paddleocr[doc-parser]==3.7.0", "python-docx==1.2.0"]

[project.optional-dependencies]
gpu = ["paddlepaddle-gpu @ https://paddle-whl.cdn.bcebos.com/stable/cu129/paddlepaddle-gpu/paddlepaddle_gpu-3.3.1-cp312-cp312-linux_x86_64.whl"]
cpu = ["paddlepaddle==3.3.1"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true
